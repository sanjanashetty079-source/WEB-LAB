<!DOCTYPE html>
<html>
<head>
  <title>Text Animation</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
  </style>
</head>
<body>
  <h1 id="animatedText"></h1>

  <script>
    var textElement = document.getElementById("animatedText");
    var fontSize = 5;
    var isGrowing = true;

    // Start with the growing text in red
    textElement.innerText = "TEXT-GROWING";
    textElement.style.color = "red";

    // Call changeSize() every 100 milliseconds
    var timerId = setInterval(changeSize, 100);

    function changeSize() {
      if (isGrowing == true) {
        fontSize = fontSize + 1;

        // At 50pt, switch to shrinking text in blue
        if (fontSize >= 50) {
          isGrowing = false;
          textElement.innerText = "TEXT-SHRINKING";
          textElement.style.color = "blue";
        }
      } else {
        fontSize = fontSize - 1;

        // Stop when font size returns to 5pt
        if (fontSize <= 5) {
          //clearInterval(timerId);
          isGrowing = true;
          textElement.innerText = "TEXT-GROWING";
          textElement.style.color = "red";
        }
      }

      textElement.style.fontSize = fontSize + "pt";
    }
  </script>
</body>
</html>
